<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CGPA Calculator</h1>
            <p>Created by Platinum</p>
            <button id="export-pdf">Export as PDF</button>
            <button id="export-png">Export as PNG</button>
        </header>

        <nav>
            <button class="tab-btn active" data-tab="semester1">Semester 1</button>
            <button class="tab-btn" data-tab="semester2">Semester 2</button>
        </nav>

        <main>
            <div id="semester1" class="tab-content active">
                <h2>Semester 1 Courses</h2>
                <div id="courses1" class="courses">
                    <!-- Course fields will be dynamically added here -->
                </div>
                <button id="add-course1">Add Course</button>
            </div>

            <div id="semester2" class="tab-content">
                <h2>Semester 2 Courses</h2>
                <div id="courses2" class="courses">
                    <!-- Course fields will be dynamically added here -->
                </div>
                <button id="add-course2">Add Course</button>
            </div>
        </main>

        <footer>
            <button id="calculate-gpa">Calculate GPA</button>
            <div id="results"></div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
<style>
    /* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
}

.container {
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

header {
    text-align: center;
    margin-bottom: 20px;
}

header h1 {
    color: #333;
    font-size: 24px;
}

header p {
    color: #666;
    font-size: 16px;
}

header button {
    margin: 10px 5px;
    padding: 10px 20px;
    font-size: 14px;
    background: #673ab7;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

header button:hover {
    background: #5c35a1;
}

nav {
    display: flex;
    justify-content: space-around;
    margin: 20px 0;
}

.tab-btn {
    padding: 10px 20px;
    font-size: 16px;
    background: #fff;
    color: #333;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.tab-btn.active {
    background: #673ab7;
    color: #fff;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

.courses {
    margin-bottom: 20px;
}

.course {
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
}

.course label {
    font-size: 14px;
    margin-bottom: 5px;
}

.course input, .course select {
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 100%;
}

.course .remove-btn {
    margin-top: 10px;
    padding: 10px;
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.course .remove-btn:hover {
    background: #cf3a2d;
}

footer {
    margin-top: 20px;
}

footer button {
    padding: 10px 20px;
    font-size: 16px;
    background: #673ab7;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

footer button:hover {
    background: #5c35a1;
}

#results {
    margin-top: 20px;
    padding: 20px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 5px;
}

#results h2 {
    color: #333;
    font-size: 20px;
}

#results p {
    margin: 10px 0;
    font-size: 16px;
}

#results table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

#results table th, #results table td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: left;
}

#results table th {
    background: #f4f4f9;
}

#results .classification {
    background: #dff0d8;
    padding: 10px;
    border: 1px solid #d6e9c6;
    border-radius: 5px;
    margin-top: 20px;
}
</style>
</html>
